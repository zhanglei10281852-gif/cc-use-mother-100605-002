[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twin_replay"
version = "0.1.0"
description = "风机遥测封存、迟到补偿与可恢复历史回放系统"
requires-python = ">=3.11"

[project.scripts]
twin-replay = "twin_replay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
